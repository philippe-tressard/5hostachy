# =============================================================================
#  pg_hba.conf — QUI peut se connecter à la base, et comment (DI-7b, #1781)
#
#  Monté en lecture seule dans `hostachy_postgres` (docker-compose.yml,
#  `-c hba_file=`). La première ligne qui correspond décide ; toute connexion
#  qu'aucune ligne n'admet est REFUSÉE.
#
#  🔒 Aucune ligne `trust` hors du socket local du conteneur ; tout accès par le
#  réseau exige `scram-sha-256` (mot de passe jamais envoyé en clair). La
#  RÉPLICATION n'est admise que du rôle `replication`, depuis l'IP de l'AUTRE
#  nœud — le port est lié à l'IP du LAN (`PG_ECOUTE`), jamais à toutes les
#  interfaces. 🔒 `api/tests/test_postgresql_compose.py`.
# =============================================================================

# TYPE  BASE         UTILISATEUR  ADRESSE            MÉTHODE
# Le socket du conteneur : `docker exec hostachy_postgres psql` (contrôles C37,
# sauvegarde) et la sonde `pg_isready`.
local   all          all                             trust
# L'API, par le réseau Docker `hostachy` (172.16.0.0/12, comme Caddy le déclare).
host    all          all          172.16.0.0/12      scram-sha-256
host    all          all          127.0.0.1/32       scram-sha-256
# La réplication en continu entre les deux Raspberry Pi — l'un ou l'autre peut
# être le primaire, selon la bascule de la nuit.
host    replication  replication  192.168.1.222/32   scram-sha-256
host    replication  replication  192.168.1.223/32   scram-sha-256
