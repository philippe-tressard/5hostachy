# =============================================================================
#  Dependabot — mises à jour de dépendances
#
#  POURQUOI cette configuration existe (04/08/2026) :
#    Sans elle, Dependabot applique ses défauts, et ses défauts ne conviennent
#    pas à ce projet. Deux problèmes constatés dès les deux premières PR :
#
#    1. ELLES VISAIENT `main`, c'est-à-dire la PRODUCTION. Or `auto-deploy.sh`
#       déploie `origin/main` toutes les 5 minutes : fusionner une PR de
#       dépendances aurait déployé sans passer par `dev`, sans pré-check, et
#       sans que le standby soit resynchronisé. Tout le flux du projet
#       court-circuité par un robot. → `target-branch: dev`.
#
#    2. ELLES GROUPAIENT TOUT ENSEMBLE. La PR pip mélangeait un correctif de
#       sécurité (`python-multipart` 0.0.19 → 0.0.31, analyseur de
#       téléversement) avec un saut de version MAJEURE de Pillow (11 → 12) et
#       SIX versions majeures de WeasyPrint (63 → 69), moteur des documents
#       imprimables. La PR était VERTE — parce qu'aucun test ne rend un PDF.
#       Un correctif de sécurité qu'on ne peut pas fusionner sans embarquer
#       deux sauts majeurs non vérifiés, c'est un correctif qu'on repousse.
#
#  D'OÙ LE DÉCOUPAGE CI-DESSOUS : les mises à jour mineures et correctives sont
#  groupées (peu risquées, fusionnables d'un bloc) ; les MAJEURES arrivent
#  SEULES, chacune dans sa PR, parce que chacune mérite d'être regardée et
#  qu'une majeure noyée dans un groupe de douze ne l'est jamais.
#
#  UNE EXCEPTION, apprise le soir même : une FAMILLE COORDONNÉE ne peut pas se
#  juger paquet par paquet, parce que ses membres se contraignent mutuellement
#  et qu'une PR isolée n'arrive même pas à s'installer. Voir les groupes
#  `tiptap` et `chaine-svelte` plus bas — ils passent AVANT les groupes par type
#  de mise à jour, Dependabot retenant le premier groupe qui reconnaît un paquet.
#
#  ✅ Mis à jour le 04/08/2026 au soir : le contrôle de rendu manquant existe
#  désormais (`api/tests/test_documents_pdf.py`, avec pango/cairo installés dans
#  le job). Il a immédiatement fait son travail : Pillow 12 et WeasyPrint 69 ont
#  été acceptés parce qu'ils rendent réellement une fiche arrivant et une annonce
#  de hall — pas parce que leur CI était verte.
# =============================================================================
version: 2

updates:
  # ── Backend Python ─────────────────────────────────────────────────────────
  - package-ecosystem: pip
    directory: /api
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-mineur:
        applies-to: version-updates
        update-types: [minor, patch]
      python-securite:
        applies-to: security-updates
        update-types: [minor, patch]
    # Les majeures ne figurent dans aucun groupe : Dependabot leur ouvre donc
    # une PR chacune, ce qui est exactement le but. Rien à déclarer pour ça.

  # ── Frontend npm ───────────────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /front
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      #  ⚠️ LES FAMILLES COORDONNÉES D'ABORD — Dependabot affecte une dépendance
      #  au PREMIER groupe qui la reconnaît. Déclarées après les groupes par
      #  type de mise à jour, elles n'attraperaient jamais rien.
      #
      #  Pourquoi elles existent (04/08/2026) : la règle « une majeure = une PR »
      #  rend chaque saut jugeable — sauf pour un ensemble dont les paquets se
      #  contraignent mutuellement. #253 montait `@tiptap/core` seul en 3.29.2 :
      #      Found: @tiptap/pm@2.27.2
      #        peer @tiptap/pm@"^2.7.0"  from @tiptap/extension-placeholder@2.27.2
      #        peer @tiptap/pm@"3.29.2"  from @tiptap/core@3.29.2
      #  npm n'arrivait même pas à installer (ERESOLVE) : la PR ne pouvait pas
      #  être jugée, elle ne pouvait qu'échouer. Tiptap épingle ses pairs à la
      #  version EXACTE — même un correctif isolé casserait. Ces paquets bougent
      #  donc ensemble, quel que soit le type de mise à jour.
      tiptap:
        patterns: ["@tiptap/*"]
      #  Même raison pour la chaîne de construction : #252 (Vite 6 → 8) échouait
      #  aussi en ERESOLVE, la plage de pairs de SvelteKit ne l'admettant pas.
      chaine-svelte:
        patterns: ["vite", "@sveltejs/*", "vite-plugin-*", "svelte", "svelte-check"]
      npm-mineur:
        applies-to: version-updates
        update-types: [minor, patch]
      npm-securite:
        applies-to: security-updates
        update-types: [minor, patch]

  # ── Actions GitHub ─────────────────────────────────────────────────────────
  # Une action figée sur une version vulnérable a accès au dépôt et aux
  # secrets du workflow : elle mérite le même suivi que le code.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
